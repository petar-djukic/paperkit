id: test-rel00.2-floats
title: Test Suite for Release 00.2 Floats
release: "00.2"

overview: |
  This suite plans the evidence for the float renderers and the backport
  constraint they answer to. Its cases carry no Go test yet: the components
  land with rel00.2, and each case names the acceptance criteria that
  release has to satisfy. The backport cases run against the reader the
  consuming pipeline uses, so they are skipped where that reader is absent.

traces:
  - rel00.2-uc001-floats-in-two-columns

preconditions:
  - The text core of rel00.1 converts a prose chapter end to end.
  - 'The float renderers are implemented: srd004-figures and srd005-tables.'
  - The pipeline reader is available for the backport cases, which skip cleanly where it is not.

test_cases:
  - name: 'srd004-figures R1.1, R1.2, R2.1, R2.2, R2.3, R4.1, and AC1 with the example the SRD states, byte for byte'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureRendersTheSRDExample
    status: done
    description: |
      TestFigureRendersTheSRDExample covers srd004-figures R1.1, R1.2, R2.1,
      R2.2, R2.3, R4.1, and AC1 with the example the SRD states, byte for byte.
    traces:
      - srd004-figures R1.1
      - srd004-figures R1.2
      - srd004-figures R2.1
      - srd004-figures R2.2
      - srd004-figures R2.3
      - srd004-figures R4.1
      - srd004-figures AC1
  - name: 'srd004-figures R3.1 and AC2 with the second example the SRD states'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestWideFigureSpansBothColumns
    status: done
    description: |
      TestWideFigureSpansBothColumns covers srd004-figures R3.1 and AC2 with the
      second example the SRD states.
    traces:
      - srd004-figures R3.1
      - srd004-figures AC2
  - name: 'srd004-figures R3.2, R3.4, and AC2 with the third example, plus the two-column measure'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureWidthScalesTheEnclosingMeasure
    status: done
    description: |
      TestFigureWidthScalesTheEnclosingMeasure covers srd004-figures R3.2, R3.4,
      and AC2 with the third example, plus the two-column measure.
    traces:
      - srd004-figures R3.2
      - srd004-figures R3.4
      - srd004-figures AC2
  - name: 'the directory is dropped because the container supplies a graphics path, and the extension is never rewritten'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureKeepsItsFileName
    status: done
    description: |
      TestFigureKeepsItsFileName covers srd004-figures R4.1, R4.2, and AC3: the
      directory is dropped because the container supplies a graphics path, and
      the extension is never rewritten.
    traces:
      - srd004-figures R4.1
      - srd004-figures R4.2
      - srd004-figures AC3
  - name: 'the caption escapes and renders inline constructs as a paragraph does'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureCaptionTakesTheInlinePath
    status: done
    description: |
      TestFigureCaptionTakesTheInlinePath covers srd004-figures R2.2: the
      caption escapes and renders inline constructs as a paragraph does.
    traces:
      - srd004-figures R2.2
  - name: 'identifiers are not normalized, slugged, or prefixed'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureIdentifierIsEmittedVerbatim
    status: done
    description: |
      TestFigureIdentifierIsEmittedVerbatim covers srd004-figures R2.3:
      identifiers are not normalized, slugged, or prefixed.
    traces:
      - srd004-figures R2.3
  - name: 'each failure names the construct and its line rather than emitting a float nobody can reference'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureErrors
    status: done
    description: |
      TestFigureErrors covers srd004-figures R1.3, R1.4, R3.3, R4.4, and AC4:
      each failure names the construct and its line rather than emitting a float
      nobody can reference.
    traces:
      - srd004-figures R1.3
      - srd004-figures R1.4
      - srd004-figures R3.3
      - srd004-figures R4.4
      - srd004-figures AC4
  - name: 'an image with other content beside it is inline, and inline images have no mapping'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestInlineImageIsNotAFloat
    status: done
    description: |
      TestInlineImageIsNotAFloat covers srd004-figures R1.1: an image with other
      content beside it is inline, and inline images have no mapping.
    traces:
      - srd004-figures R1.1
  - name: 'the renderer does not check that the figure exists, because conversion opens no file'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureReadsNoFile
    status: done
    description: |
      TestFigureReadsNoFile covers srd004-figures R4.3: the renderer does not
      check that the figure exists, because conversion opens no file.
    traces:
      - srd004-figures R4.3
  - name: 'no adjustbox, and nothing between the float and its caption'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureEmitsNoWrapper
    status: done
    description: |
      TestFigureEmitsNoWrapper covers srd004-figures R2.4 and AC5: no adjustbox,
      and nothing between the float and its caption.
    traces:
      - srd004-figures R2.4
      - srd004-figures AC5
  - name: 'including the column specification its weighting produces'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestTableRendersTheSRDExample
    status: done
    description: |
      TestTableRendersTheSRDExample covers srd005-tables R1.1, R1.2, R2.1, R2.2,
      R2.3, R2.5, R2.7, R3.6, and AC1 with the first example the SRD states,
      byte for byte -- including the column specification its weighting
      produces.
    traces:
      - srd005-tables R1.1
      - srd005-tables R1.2
      - srd005-tables R2.1
      - srd005-tables R2.2
      - srd005-tables R2.3
      - srd005-tables R2.5
      - srd005-tables R2.7
      - srd005-tables R3.6
      - srd005-tables AC1
  - name: 'five columns select the starred float on the column count alone'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestWideTableRendersTheSRDExample
    status: done
    description: |
      TestWideTableRendersTheSRDExample covers srd005-tables R4.1, R4.5, and AC3
      with the second example: five columns select the starred float on the
      column count alone.
    traces:
      - srd005-tables R4.1
      - srd005-tables R4.5
      - srd005-tables AC3
  - name: 'whatever the damping, the floors, and the clamp do to a column, the weights are rescaled to sum to the column count, whi'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestColumnWeightsSumToTheColumnCount
    status: done
    description: |
      TestColumnWeightsSumToTheColumnCount covers srd005-tables R3.1, R3.2,
      R3.3, R3.5, and AC2: whatever the damping, the floors, and the clamp do to
      a column, the weights are rescaled to sum to the column count, which is
      what tabularx requires of an hsize specification. The floors and the clamp
      are steps rather than invariants of the result: the rescale that restores
      the sum can carry a floored column back under its floor, which is what the
      reference filter does and what the SRD's own worked examples show.
    traces:
      - srd005-tables R3.1
      - srd005-tables R3.2
      - srd005-tables R3.3
      - srd005-tables R3.5
      - srd005-tables AC2
  - name: 'the weighting follows the cell contents, damped so ten times the text does not take ten times the measure'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestLongerColumnsTakeMoreWidth
    status: done
    description: |
      TestLongerColumnsTakeMoreWidth covers srd005-tables R3.1 and R3.2: the
      weighting follows the cell contents, damped so ten times the text does not
      take ten times the measure.
    traces:
      - srd005-tables R3.1
      - srd005-tables R3.2
  - name: 'a column is floored at the width its longest unbreakable word needs, because a narrower one overflows the rule. The same'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestAnUnbreakableWordWidensItsColumn
    status: done
    description: |
      TestAnUnbreakableWordWidensItsColumn covers srd005-tables R3.4: a column
      is floored at the width its longest unbreakable word needs, because a
      narrower one overflows the rule. The same table with that word broken up
      weighs the column lower.
    traces:
      - srd005-tables R3.4
  - name: 'word length is measured after removing LaTeX control sequences and braces, so a citation does not widen a column by the '
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestControlSequencesDoNotCountAsWordLength
    status: done
    description: |
      TestControlSequencesDoNotCountAsWordLength covers srd005-tables R3.4: word
      length is measured after removing LaTeX control sequences and braces, so a
      citation does not widen a column by the length of its command.
    traces:
      - srd005-tables R3.4
  - name: 'the width bar and the height bar each span a table the column count alone would leave in one column'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestWideDecisionReadsMoreThanTheColumnCount
    status: done
    description: |
      TestWideDecisionReadsMoreThanTheColumnCount covers srd005-tables R4.1,
      R4.2, R4.3, R4.4, and AC3: the width bar and the height bar each span a
      table the column count alone would leave in one column.
    traces:
      - srd005-tables R4.1
      - srd005-tables R4.2
      - srd005-tables R4.3
      - srd005-tables R4.4
      - srd005-tables AC3
  - name: 'a cell escapes and renders citations and emphasis as a paragraph does'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestTableCellsTakeTheInlinePath
    status: done
    description: |
      TestTableCellsTakeTheInlinePath covers srd005-tables R2.6 and AC7: a cell
      escapes and renders citations and emphasis as a paragraph does.
    traces:
      - srd005-tables R2.6
      - srd005-tables AC7
  - name: 'a caption carrying emphasis or a citation renders them'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestTableCaptionTakesTheInlinePath
    status: done
    description: |
      TestTableCaptionTakesTheInlinePath covers srd005-tables R2.1 and
      srd009-backport-compatibility R2.4: a caption carrying emphasis or a
      citation renders them.
    traces:
      - srd005-tables R2.1
      - srd009-backport-compatibility R2.4
  - name: 'the default is one step below the body, and a caller asking for body size gets no command'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestTableFontSizeIsConfigurable
    status: done
    description: |
      TestTableFontSizeIsConfigurable covers srd005-tables R2.7: the default is
      one step below the body, and a caller asking for body size gets no
      command.
    traces:
      - srd005-tables R2.7
  - name: 'each failure names the table and its line'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestTableErrors
    status: done
    description: |
      TestTableErrors covers srd005-tables R1.3, R1.4, R1.5, R5.4, and AC4: each
      failure names the table and its line.
    traces:
      - srd005-tables R1.3
      - srd005-tables R1.4
      - srd005-tables R1.5
      - srd005-tables R5.4
      - srd005-tables AC4
  - name: 'a paragraph opening with the caption prefix that follows no table is prose'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestCaptionParagraphElsewhereIsProse
    status: done
    description: |
      TestCaptionParagraphElsewhereIsProse covers srd005-tables R1.3 and AC6: a
      paragraph opening with the caption prefix that follows no table is prose.
    traces:
      - srd005-tables R1.3
      - srd005-tables AC6
  - name: 'a table with nothing to measure takes equal-width columns rather than failing'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestEmptyWeightingFallsBack
    status: done
    description: |
      TestEmptyWeightingFallsBack covers srd005-tables R3.7 and AC8: a table
      with nothing to measure takes equal-width columns rather than failing.
    traces:
      - srd005-tables R3.7
      - srd005-tables AC8
  - name: 'no longtable, no strip, no bold header, and nothing between the float and its caption'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestTableEmitsNoForbiddenForm
    status: done
    description: |
      TestTableEmitsNoForbiddenForm covers srd005-tables R2.4, R5.1, R5.2, R5.3,
      and AC5: no longtable, no strip, no bold header, and nothing between the
      float and its caption.
    traces:
      - srd005-tables R2.4
      - srd005-tables R5.1
      - srd005-tables R5.2
      - srd005-tables R5.3
      - srd005-tables AC5
  - name: 'a caption line carrying the class spans both columns whatever the measurement would have chosen. The fixture is the tuto'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestTheWideClassForcesTheStarredFloat
    status: done
    description: |
      TestTheWideClassForcesTheStarredFloat covers srd005-tables R4.6, R4.8, and
      AC9: a caption line carrying the class spans both columns whatever the
      measurement would have chosen. The fixture is the tutorial table that
      found this gap: three columns, a longest cell of 99 characters, and an
      estimated height of 34 lines, so it falls under every bar R4.1 states and
      renders in one column without the class.
    traces:
      - srd005-tables R4.6
      - srd005-tables R4.8
      - srd005-tables AC9
  - name: 'without the class a table is measured exactly as before, and there is no class holding a table in one column that the me'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestTheClassForcesSpanningAndNothingElse
    status: done
    description: |
      TestTheClassForcesSpanningAndNothingElse covers srd005-tables R4.7:
      without the class a table is measured exactly as before, and there is no
      class holding a table in one column that the measurement would widen.
    traces:
      - srd005-tables R4.7
  - name: 'a caption line without the class renders exactly what it rendered before the class existed. The two SRD fixtures are the'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestNoExistingTableMoves
    status: done
    description: |
      TestNoExistingTableMoves covers srd005-tables R4.7 and AC9: a caption line
      without the class renders exactly what it rendered before the class
      existed. The two SRD fixtures are the check that matters, because their
      expected output is stated in the specification: if either moved, the class
      would have changed behavior nobody asked it to change.
    traces:
      - srd005-tables R4.7
      - srd005-tables AC9
  - name: 'no fixture the float renderers emit carries a form the SRD forbids, the bold header row among them'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestEmittedFloatsCarryNoForbiddenForm
    status: done
    description: |
      TestEmittedFloatsCarryNoForbiddenForm covers srd009-backport-compatibility
      R1.1, R3.1, R3.2, R3.3, R3.4, R3.5, R3.6, AC3, and AC4: no fixture the
      float renderers emit carries a form the SRD forbids, the bold header row
      among them.
    traces:
      - srd009-backport-compatibility R1.1
      - srd009-backport-compatibility R3.1
      - srd009-backport-compatibility R3.2
      - srd009-backport-compatibility R3.3
      - srd009-backport-compatibility R3.4
      - srd009-backport-compatibility R3.5
      - srd009-backport-compatibility R3.6
      - srd009-backport-compatibility AC3
      - srd009-backport-compatibility AC4
  - name: 'every emitted float carries the plain caption and label pair, in the order its kind states, with nothing between them'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestEmittedFloatsCarryPlainCaptions
    status: done
    description: |
      TestEmittedFloatsCarryPlainCaptions covers srd009-backport-compatibility
      R2.1, R2.2, R2.3, R2.4, and AC1: every emitted float carries the plain
      caption and label pair, in the order its kind states, with nothing between
      them.
    traces:
      - srd009-backport-compatibility R2.1
      - srd009-backport-compatibility R2.2
      - srd009-backport-compatibility R2.3
      - srd009-backport-compatibility R2.4
      - srd009-backport-compatibility AC1
  - name: 'a figure captions after its include and a table captions before its body, which is what the manuscripts hand-write'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestCaptionOrderFollowsTheFloatKind
    status: done
    description: |
      TestCaptionOrderFollowsTheFloatKind covers srd009-backport-compatibility
      R2.3: a figure captions after its include and a table captions before its
      body, which is what the manuscripts hand-write.
    traces:
      - srd009-backport-compatibility R2.3
  - name: 'a caption carrying emphasis or a citation comes back carrying the same, because the reader recovers both'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestCaptionsCarryTheirInlineContent
    status: done
    description: |
      TestCaptionsCarryTheirInlineContent covers srd009-backport-compatibility
      R2.4: a caption carrying emphasis or a citation comes back carrying the
      same, because the reader recovers both.
    traces:
      - srd009-backport-compatibility R2.4
  - name: 'the constraint binds the front matter, the renderer core, and the float renderers, and does not bind raw LaTeX the autho'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestTheConstraintBindsTheEmittingComponents
    status: done
    description: |
      TestTheConstraintBindsTheEmittingComponents covers srd009-backport-
      compatibility R1.4: the constraint binds the front matter, the renderer
      core, and the float renderers, and does not bind raw LaTeX the author
      wrote.
    traces:
      - srd009-backport-compatibility R1.4
  - name: 'a float-placement edit is expected to be lost on the way back, and is not what this constraint protects'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestTypesettingEditsAreNotProse
    status: done
    description: |
      TestTypesettingEditsAreNotProse covers srd009-backport-compatibility R1.3
      and AC5: a float-placement edit is expected to be lost on the way back,
      and is not what this constraint protects.
    traces:
      - srd009-backport-compatibility R1.3
      - srd009-backport-compatibility AC5
  - name: 'every fixture''s caption and cell text comes back as prose rather than inside a raw block, and the whole set skips cleanl'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestEmittedFloatsReadBackAsProse
    status: done
    description: |
      TestEmittedFloatsReadBackAsProse covers srd009-backport-compatibility
      R1.1, R4.1, R4.2, R4.4, AC1, and AC6: every fixture's caption and cell
      text comes back as prose rather than inside a raw block, and the whole set
      skips cleanly where the reader is absent.
    traces:
      - srd009-backport-compatibility R1.1
      - srd009-backport-compatibility R4.1
      - srd009-backport-compatibility R4.2
      - srd009-backport-compatibility R4.4
      - srd009-backport-compatibility AC1
      - srd009-backport-compatibility AC6
  - name: 'a caption edited in the emitted LaTeX differs after the round trip, and differs in the caption rather than everywhere'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestACaptionEditComesBackAsProse
    status: done
    description: |
      TestACaptionEditComesBackAsProse covers srd009-backport-compatibility
      R2.1, R4.3, and AC2: a caption edited in the emitted LaTeX differs after
      the round trip, and differs in the caption rather than everywhere.
    traces:
      - srd009-backport-compatibility R2.1
      - srd009-backport-compatibility R4.3
      - srd009-backport-compatibility AC2
  - name: 'typesetting is expected to be lost on the way back, which is the boundary this constraint draws'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestAPlacementEditComesBackAsNothing
    status: done
    description: |
      TestAPlacementEditComesBackAsNothing covers srd009-backport-compatibility
      R1.3 and AC5: typesetting is expected to be lost on the way back, which is
      the boundary this constraint draws.
    traces:
      - srd009-backport-compatibility R1.3
      - srd009-backport-compatibility AC5
  - name: 'the one exception the constraint admits, asserted rather than left as a question. The reader recovers a plain table floa'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestAWideTableDropsItsCaptionAndKeepsItsCells
    status: done
    description: |
      TestAWideTableDropsItsCaptionAndKeepsItsCells covers srd009-backport-
      compatibility R3.6, R3.7, R3.8, and AC7: the one exception the constraint
      admits, asserted rather than left as a question. The reader recovers a
      plain table float's caption as a markdown table caption and treats the
      starred form as an unknown division, dropping the caption. srd005-tables
      R4.5 needs the starred form for a spanning table, so a caption edit to a
      wide table does not reach the markdown. What does survive is everything
      else: the cell text comes back as prose, and because the caption is
      dropped on both sides of the pipeline's comparison, the lost edit is
      ignored rather than corrupting the source.
    traces:
      - srd005-tables R4.5
      - srd009-backport-compatibility R3.6
      - srd009-backport-compatibility R3.7
      - srd009-backport-compatibility R3.8
      - srd009-backport-compatibility AC7
  - name: 'the evidence the exception rests on. The same table set unstarred returns its caption, so the loss is the starred enviro'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestAnUnstarredTableKeepsItsCaption
    status: done
    description: |
      TestAnUnstarredTableKeepsItsCaption covers srd009-backport-compatibility
      R3.8 and AC7: the evidence the exception rests on. The same table set
      unstarred returns its caption, so the loss is the starred environment's
      and not the table renderer's.
    traces:
      - srd009-backport-compatibility R3.8
      - srd009-backport-compatibility AC7
  - name: 'every form the SRD forbids is found and named, with the line it sits on'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestForbiddenFindsEachForm
    status: done
    description: |
      TestForbiddenFindsEachForm covers srd009-backport-compatibility R3.1,
      R3.2, R3.3, R3.4, R3.5, and AC3: every form the SRD forbids is found and
      named, with the line it sits on.
    traces:
      - srd009-backport-compatibility R3.1
      - srd009-backport-compatibility R3.2
      - srd009-backport-compatibility R3.3
      - srd009-backport-compatibility R3.4
      - srd009-backport-compatibility R3.5
      - srd009-backport-compatibility AC3
  - name: 'the plain float the SRD permits carries nothing forbidden'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestForbiddenPassesThePermittedForms
    status: done
    description: |
      TestForbiddenPassesThePermittedForms covers srd009-backport-compatibility
      R2.1 and R2.2: the plain float the SRD permits carries nothing forbidden.
    traces:
      - srd009-backport-compatibility R2.1
      - srd009-backport-compatibility R2.2
  - name: 'the rule is about a header row of bold cells, not about emphasis an author wrote inside a sentence'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestBoldCellsOutsideAHeaderAreNotFlagged
    status: done
    description: |
      TestBoldCellsOutsideAHeaderAreNotFlagged covers srd009-backport-
      compatibility R3.3: the rule is about a header row of bold cells, not
      about emphasis an author wrote inside a sentence.
