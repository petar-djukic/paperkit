id: test-rel00.1-text-core
title: Test Suite for Release 00.1 Text Core
release: "00.1"

overview: |
  This suite carries the evidence for the text core: the escaper, the citation
  extension, the renderer core, and raw-LaTeX passthrough. Every case names
  the Go test that proves it and the requirements that test covers, so the
  test-evidence audit resolves each claim against the Go test inventory rather
  than against a convention in a comment.

  The suite is the source of requirement coverage for this release. A
  requirement no case names is uncovered. Two were, when this suite was
  written: srd002-renderer-core R2.2 named the graphics path and the float
  thresholds, and srd003-escaping R3.3 named the front-matter templates.
  Neither existed yet. Both are covered now, by the suites for the releases
  that brought their subjects.

traces:
  - rel00.1-uc001-prose-chapter-to-fragment
  - rel00.1-uc002-cross-chapter-label-collisions

preconditions:
  - The module builds and its tests run with the Go toolchain alone; no external checkout is needed.
  - 'The tests are hermetic: conversion opens no file, so no fixture directory is staged.'

test_cases:
  - name: 'nothing outside the ten changes'
    use_case: rel00.1-uc001-prose-chapter-to-fragment
    go_test: TestEscapeReplacesTheTenSpecials
    status: done
    description: |
      TestEscapeReplacesTheTenSpecials covers srd003-escaping R1.1 and R1.3 with
      the example the SRD states, and AC1: nothing outside the ten changes.
    traces:
      - srd003-escaping R1.1
      - srd003-escaping R1.3
      - srd003-escaping AC1
  - name: 'srd003-escaping R1.1 character by character, so a table entry that goes missing names itself'
    use_case: rel00.1-uc001-prose-chapter-to-fragment
    go_test: TestEscapeReplacesEachSpecialOnce
    status: done
    description: |
      TestEscapeReplacesEachSpecialOnce covers srd003-escaping R1.1 character by
      character, so a table entry that goes missing names itself.
    traces:
      - srd003-escaping R1.1
  - name: 'the backslashes the replacements introduce are not themselves escaped'
    use_case: rel00.1-uc001-prose-chapter-to-fragment
    go_test: TestEscapeIsSinglePass
    status: done
    description: |
      TestEscapeIsSinglePass covers srd003-escaping R1.2 and AC2: the
      backslashes the replacements introduce are not themselves escaped.
    traces:
      - srd003-escaping R1.2
      - srd003-escaping AC2
  - name: 'these strings compile as written under a Unicode-aware engine and are what the corpus actually carries'
    use_case: rel00.1-uc001-prose-chapter-to-fragment
    go_test: TestEscapePassesUnicodeThrough
    status: done
    description: |
      TestEscapePassesUnicodeThrough covers srd003-escaping R2.1, R2.2, and
      R2.3, and AC3. R2.2 is the xelatex assumption that makes passing Unicode
      through safe: these strings compile as written under a Unicode-aware
      engine and are what the corpus actually carries.
    traces:
      - srd003-escaping R2.1
      - srd003-escaping R2.2
      - srd003-escaping R2.3
      - srd003-escaping AC3
  - name: 'the output matches paperkit''s escapeLaTeX, which the manuscripts are written against. The fixtures are the title and aut'
    use_case: rel00.1-uc001-prose-chapter-to-fragment
    go_test: TestEscapeMatchesTheReferenceImplementation
    status: done
    description: |
      TestEscapeMatchesTheReferenceImplementation covers srd003-escaping R1.1
      and AC4: the output matches paperkit's escapeLaTeX, which the manuscripts
      are written against. The fixtures are the title and author fields from
      paperkit's own frontmatter tests.
    traces:
      - srd003-escaping R1.1
      - srd003-escaping AC4
  - name: 'the at sign, brackets, and parentheses are not LaTeX markup and are not escaped'
    use_case: rel00.1-uc001-prose-chapter-to-fragment
