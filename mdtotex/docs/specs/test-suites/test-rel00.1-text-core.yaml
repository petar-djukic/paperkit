    status: done
    description: |
      TestEscapeLeavesOrdinaryPunctuationAlone covers srd003-escaping R1.3: the
      at sign, brackets, and parentheses are not LaTeX markup and are not
      escaped.
    traces:
      - srd003-escaping R1.3
  - name: 'a pure function from a string to a string, with no options argument and no error return. The assignment fails to compile'
    use_case: rel00.1-uc001-prose-chapter-to-fragment
    go_test: TestEscapeIsAPlainFunction
    status: done
    description: |
      TestEscapeIsAPlainFunction covers srd003-escaping R3.1: a pure function
